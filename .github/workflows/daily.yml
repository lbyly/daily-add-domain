name: Cloudflare Domain Auto-Add (Global Key Version)

on:
  schedule:
    - cron: '0 * * * *' # 每小时运行
  workflow_dispatch:

jobs:
  auto-add:
    runs-on: ubuntu-latest
    steps:
      - name: Run Script
        env:
          CF_API_KEY: ${{ secrets.CF_API_TOKEN }}
          CF_EMAIL: ${{ secrets.CF_EMAIL }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          python - <<EOF
          import requests
          import os

          def run():
              api_key = os.getenv("CF_API_KEY", "").strip()
              email = os.getenv("CF_EMAIL", "").strip()
              account_id = os.getenv("CF_ACCOUNT_ID", "").strip()
              domain = "lbo.indevs.in"

              url = "https://api.cloudflare.com/client/v4/zones"
              
              # Global Key 必须使用 X-Auth-Key 和 X-Auth-Email
              headers = {
                  "X-Auth-Email": email,
                  "X-Auth-Key": api_key,
                  "Content-Type": "application/json",
              }
              data = {
                  "account": {"id": account_id},
                  "name": domain,
                  "type": "full"
              }

              res = requests.post(url, headers=headers, json=data).json()

              if res.get("success"):
                  print(f"🎉 成功！域名 {domain} 已添加。")
              else:
                  error = res['errors'][0]
                  print(f"❌ 失败 (代码: {error['code']}): {error['message']}")
                  if error['code'] == 1049:
                      print("💡 状态：权限已通！报错 1049 确认 Cloudflare 暂不支持该后缀，脚本将持续监测。")

          if __name__ == "__main__":
              run()
          EOF
